name: NSOS Security Arsenal

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: nsos-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Prepare SARIF output
        run: mkdir -p results

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          output: results/javascript.sarif
          upload: false

      - name: Summarize high-severity CodeQL findings
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const roots = [process.env.GITHUB_WORKSPACE, process.env.RUNNER_TEMP].filter(Boolean);
          const files = roots.flatMap(root => {
            try {
              return execFileSync("find", [root, "-maxdepth", "9", "-type", "f", "-name", "*.sarif"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            } catch {
              return [];
            }
          });
          const candidates = [...new Set(files)];
          console.log("SARIF candidates:", JSON.stringify(candidates));
          let count = 0;
          for (const file of candidates) {
            const sarif = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const run of sarif.runs ?? []) {
              const rules = new Map((run.tool?.driver?.rules ?? []).map(rule => [rule.id, rule]));
              for (const result of run.results ?? []) {
                const rule = rules.get(result.ruleId);
                const severity = Number(rule?.properties?.["security-severity"] ?? result.properties?.["security-severity"] ?? 0);
                if (severity < 7) continue;
                const location = result.locations?.[0]?.physicalLocation;
                console.log(JSON.stringify({
                  ruleId: result.ruleId,
                  severity,
                  message: result.message?.text ?? "",
                  file: location?.artifactLocation?.uri ?? "",
                  line: location?.region?.startLine ?? null
                }));
                count++;
              }
            }
          }
          console.log(`High-severity CodeQL findings: ${count}`);
          NODE

      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/javascript.sarif
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review (requires GitHub Dependency Graph)
    # Blocked until the repository owner enables GitHub Dependency Graph in Settings > Security analysis.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
