name: NSOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, migration, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://nsos:nsos_test_password@127.0.0.1:3306/nsos
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nsos
          MYSQL_USER: nsos
          MYSQL_PASSWORD: nsos_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          npm install --global corepack@0.31.0
          corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint and formatting check
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Validate database migrations
        run: pnpm drizzle-kit migrate

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build
