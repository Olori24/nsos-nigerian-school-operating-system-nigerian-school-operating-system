name: NSOS Security Arsenal

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: nsos-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
      - name: Summarize high-severity CodeQL findings
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "results/javascript.sarif";
          if (!fs.existsSync(path)) {
            console.log("CodeQL SARIF file not present.");
            process.exit(0);
          }
          const sarif = JSON.parse(fs.readFileSync(path, "utf8"));
          let count = 0;
          for (const run of sarif.runs ?? []) {
            const rules = new Map((run.tool?.driver?.rules ?? []).map(rule => [rule.id, rule]));
            for (const result of run.results ?? []) {
              const rule = rules.get(result.ruleId);
              const severity = Number(rule?.properties?.["security-severity"] ?? result.properties?.["security-severity"] ?? 0);
              if (severity < 7) continue;
              const location = result.locations?.[0]?.physicalLocation;
              console.log(JSON.stringify({
                ruleId: result.ruleId,
                severity,
                message: result.message?.text ?? "",
                file: location?.artifactLocation?.uri ?? "",
                line: location?.region?.startLine ?? null
              }));
              count++;
            }
          }
          console.log(`High-severity CodeQL findings: ${count}`);
          NODE

  dependency-review:
    name: Dependency review (requires GitHub Dependency Graph)
    # Blocked until the repository owner enables GitHub Dependency Graph in Settings > Security analysis.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
