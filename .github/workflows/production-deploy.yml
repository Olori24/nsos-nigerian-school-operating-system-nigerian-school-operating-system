name: NSOS Production Deploy

on:
  workflow_run:
    workflows:
      - NSOS CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsos-production-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
      DEPLOY_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require production deploy hook
        run: |
          if [ -z "$PRODUCTION_DEPLOY_HOOK_URL" ]; then
            echo "Missing required repository secret: PRODUCTION_DEPLOY_HOOK_URL"
            echo "Configure the production provider's authenticated deploy hook before enabling production deploys."
            exit 1
          fi

      - name: Trigger production deployment
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$PRODUCTION_DEPLOY_HOOK_URL" \
            --header "Content-Type: application/json" \
            --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"commit\":\"${DEPLOY_COMMIT}\",\"ref\":\"main\",\"source\":\"github-actions\"}"

      - name: Record deployment trigger
        run: |
          echo "Production deployment triggered for ${GITHUB_REPOSITORY}@${DEPLOY_COMMIT}."
