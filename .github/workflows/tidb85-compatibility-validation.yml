name: NSOS TiDB 8.5.x compatibility validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsos-tidb85-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TiDB ${{ matrix.tidb_version }} migrations and database integration
    strategy:
      fail-fast: false
      matrix:
        tidb_version: [v8.5.3, v8.5.8]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: mysql://root:@127.0.0.1:4000/nsos_validation
      TIDB_EXPECTED_VERSION: ${{ matrix.tidb_version }}
      JWT_SECRET: ci-tidb85-validation-jwt-secret
      APP_SECRET: ci-tidb85-validation-application-secret
      OAUTH_SERVER_URL: https://auth.test.local
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      RESEND_API_KEY: ci-test-resend-api-key
      AUTH_EMAIL_FROM: "NSOS <onboarding@resend.dev>"
      BUILT_IN_FORGE_API_KEY: ci-test-forge-api-key
      OPENAI_API_KEY: ci-test-openai-api-key

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          npm install --global corepack@0.31.0
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install TiUP
        if: matrix.tidb_version == 'v8.5.8'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
          "$HOME/.tiup/bin/tiup" --version

      - name: Start disposable TiDB v8.5.8 cluster
        if: matrix.tidb_version == 'v8.5.8'
        run: |
          nohup "$HOME/.tiup/bin/tiup" playground "v8.5.8" \
            --db 1 --pd 1 --kv 1 --tiflash 0 --without-monitor \
            > /tmp/nsos-tidb-playground.log 2>&1 &
          echo $! > /tmp/nsos-tidb-playground.pid

      - name: Start disposable TiDB v8.5.3 standalone instance
        if: matrix.tidb_version == 'v8.5.3'
        run: |
          docker run --detach --name nsos-tidb-v853 \
            --publish 4000:4000 \
            pingcap/tidb:v8.5.3 \
            --store=unistore --path=""

      - name: Wait for TiDB and prepare isolated test database
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const deadline = Date.now() + 10 * 60 * 1000;
          let connection;
          let lastError;
          while (Date.now() < deadline) {
            try {
              connection = await mysql.createConnection({
                host: "127.0.0.1",
                port: 4000,
                user: "root",
                connectTimeout: 5000,
              });
              break;
            } catch (error) {
              lastError = error;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }
          if (!connection) {
            console.error(lastError);
            process.exit(1);
          }
          try {
            const [versionRows] = await connection.query("SELECT VERSION() AS version");
            const version = String(versionRows[0].version);
            if (!version.toLowerCase().includes("tidb") || !version.toLowerCase().includes(process.env.TIDB_EXPECTED_VERSION)) {
              throw new Error(`Expected TiDB, received: ${version}`);
            }
            await connection.query("CREATE DATABASE nsos_validation");
            await connection.query("SET GLOBAL tidb_enable_check_constraint = ON");
            console.log(`Connected to ${version}; expected ${process.env.TIDB_EXPECTED_VERSION}`);
            console.log("Created disposable nsos_validation database");
            console.log("Enabled CHECK enforcement for rollback integration coverage");
          } finally {
            await connection.end();
          }
          NODE

      - name: Apply all committed Drizzle migrations to clean TiDB
        run: pnpm exec drizzle-kit migrate

      - name: Verify TiDB migration ledger and required tables
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const connection = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            const [migrationRows] = await connection.query(
              "SELECT COUNT(*) AS count FROM __drizzle_migrations"
            );
            const applied = Number(migrationRows[0].count);
            if (applied < 68) {
              throw new Error(`Expected at least 68 committed migrations; found ${applied}`);
            }
            const [tableRows] = await connection.query(
              "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE()"
            );
            const tables = new Set(tableRows.map((row) => row.TABLE_NAME));
            const required = [
              "reminderPolicies",
              "reminderRuns",
              "cashAssuranceCases",
              "securityAuditEvents",
            ];
            const missing = required.filter((name) => !tables.has(name));
            if (missing.length) {
              throw new Error(`Missing required tables: ${missing.join(", ")}`);
            }
            console.log(`Applied migration records: ${applied}`);
            console.log(`Tables created: ${tables.size}`);
            console.log(`Required tables verified: ${required.join(", ")}`);
          } finally {
            await connection.end();
          }
          NODE

      - name: Run database lifecycle, collation, ID, recovery, rollback, and concurrency integration tests
        run: pnpm exec vitest run server/db.cash-assurance-reminders.test.ts server/db.compatibility.test.ts

      - name: Show TiDB diagnostics on failure
        if: failure()
        run: |
          echo "TiDB playground log:"
          tail -n 200 /tmp/nsos-tidb-playground.log || true
