<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1715" />
    <title>NSOS is offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #0b1715; color: #f7f3e8; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { max-width: 440px; }
      .mark { align-items: center; background: #0f5c4f; border-radius: 18px; display: grid; height: 48px; margin-bottom: 28px; place-items: center; width: 48px; }
      .mark span { border: 2px solid #f7f3e8; border-radius: 7px 7px 12px 12px; height: 19px; width: 21px; }
      h1 { font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -0.055em; line-height: .98; margin: 0; }
      p { color: #c3cec8; font-size: 1rem; line-height: 1.7; margin: 20px 0 0; }
      a { color: #dcefe1; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span></div>
      <h1>NSOS needs a connection.</h1>
      <p>Your sign-in, school records, and live updates remain protected. Reconnect to continue working in the Nigerian School Operating System.</p>
      <p><a href="/">Try NSOS again</a></p>
    </main>
  </body>
</html>
