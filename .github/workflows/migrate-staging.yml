name: NSOS staging database migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-NSOS-STAGING to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nsos-staging-database-migrations
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Apply reviewed Drizzle migrations to staging only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.confirmation == 'MIGRATE-NSOS-STAGING' }}
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Check out migration source
        uses: actions/checkout@v4

      - name: Validate staging target before any database write
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.DATABASE_URL;
          if (!raw) throw new Error("STAGING_DATABASE_URL repository secret is missing");
          const url = new URL(raw);
          if (url.protocol !== "mysql:") throw new Error("Refusing migration: URL must use mysql:");
          if (url.hostname !== "gateway01.ap-northeast-1.prod.aws.tidbcloud.com") throw new Error("Refusing migration: unexpected database host");
          if (url.port !== "4000") throw new Error("Refusing migration: unexpected database port");
          if (decodeURIComponent(url.pathname.slice(1)) !== "nsos_staging") throw new Error("Refusing migration: database must be nsos_staging");
          if (!url.searchParams.has("ssl")) throw new Error("Refusing migration: TLS settings are required");
          console.log("Target verified: TiDB staging / nsos_staging. Credentials are not printed.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          npm install --global corepack@0.31.0
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply committed Drizzle migrations
        run: pnpm exec drizzle-kit migrate

      - name: Verify required NSOS tables exist
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const url = new URL(process.env.DATABASE_URL);
          const connection = await mysql.createConnection({
            host: url.hostname,
            port: Number(url.port),
            user: decodeURIComponent(url.username),
            password: decodeURIComponent(url.password),
            database: decodeURIComponent(url.pathname.slice(1)),
            ssl: { rejectUnauthorized: true },
            connectTimeout: 15000
          });
          try {
            const [rows] = await connection.query(
              "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE()"
            );
            const names = new Set(rows.map(row => row.TABLE_NAME));
            const required = ["users", "schools", "schoolMemberships", "schoolWebsites"];
            const missing = required.filter(name => !names.has(name));
            console.log(`Staging tables found: ${names.size}`);
            console.log(`Core tables: ${required.filter(name => names.has(name)).join(", ")}`);
            if (missing.length) throw new Error(`Migration verification failed; missing core tables: ${missing.join(", ")}`);
          } finally {
            await connection.end();
          }
          NODE
