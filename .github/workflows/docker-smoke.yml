name: NSOS Docker Smoke

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker.env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "vite.config.ts"
      - ".github/workflows/docker-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker.env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "vite.config.ts"
      - ".github/workflows/docker-smoke.yml"

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare synthetic Compose environment
        run: |
          cat > .env <<'EOF'
          VITE_APP_ID=nsos-synthetic-ci
          VITE_OAUTH_PORTAL_URL=https://auth.example.invalid
          DATABASE_URL=mysql://synthetic:synthetic@127.0.0.1:3306/nsos_test
          OAUTH_SERVER_URL=https://auth.example.invalid
          NSOS_HOST_PORT=3000
          JWT_SECRET=dotenv-sentinel-must-never-reach-container
          EOF

      - name: Build without runtime secret
        run: |
          env -u JWT_SECRET docker compose build

      - name: Verify .env cannot supply JWT_SECRET
        run: |
          env -u JWT_SECRET docker compose run --rm --no-deps --entrypoint node nsos \
            -e "if (process.env.JWT_SECRET) { console.error('JWT_SECRET leaked from .env'); process.exit(1); }"

      - name: Start with synthetic runtime secret
        run: |
          export JWT_SECRET=ci-only-not-a-real-secret-32-characters-minimum
          docker compose up -d
          unset JWT_SECRET

      - name: Verify process health through configured host binding
        run: |
          HOST_BINDING="$(docker compose port nsos 3000)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://${HOST_BINDING}/healthz"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 nsos
          exit 1

      - name: Verify management commands after unsetting secret
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100 nsos || true
          docker compose down --remove-orphans || true
