name: Configure NSOS Staging Storage

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CONFIGURE_STAGING_STORAGE to update Preview variables"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nsos-staging-storage-config
  cancel-in-progress: false

jobs:
  configure:
    # Never allow a dispatch from a feature/PR ref to access staging secrets.
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'CONFIGURE_STAGING_STORAGE'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN S3_BUCKET S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub environment secret: $name"
              exit 1
            fi
          done

      - name: Configure Vercel Preview environment only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          VERCEL_PROJECT_ID: prj_xjIPyNyC6VIs6tE0Hb0ODcfBbqTs
          VERCEL_TEAM_ID: team_NKFPuLmPv9szBq7kwqFVfafV
          PREVIEW_BRANCH: fix/remove-manus-native-google-auth
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&upsert=true"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          upsert_env() {
            local key="$1" value="$2" type="$3"
            local payload status error_code
            payload=$(jq -n --arg key "$key" --arg value "$value" --arg type "$type" --arg branch "$PREVIEW_BRANCH" \
              '{key:$key,value:$value,type:$type,target:["preview"],gitBranch:$branch}')

            # POST with upsert=true replaces an existing matching variable without
            # using PATCH, which returned HTTP 400 for the existing sensitive key.
            status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" --data "$payload" "$api")

            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              error_code=$(jq -r '.error.code // .errorCode // "not_provided"' "$response_file" 2>/dev/null || echo "unavailable")
              echo "::error::Vercel rejected $key (HTTP $status; code: $error_code). Response body withheld to protect credentials."
              exit 1
            fi

            echo "Configured $key for Preview branch only."
          }

          upsert_env S3_BUCKET "$S3_BUCKET" encrypted
          upsert_env S3_ENDPOINT "$S3_ENDPOINT" encrypted
          upsert_env S3_ACCESS_KEY_ID "$S3_ACCESS_KEY_ID" sensitive
          upsert_env S3_SECRET_ACCESS_KEY "$S3_SECRET_ACCESS_KEY" sensitive
          upsert_env S3_REGION "auto" plain
