name: NSOS Performance Arsenal

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Explicit approval for an isolated staging read-only load test"
        required: true
        type: boolean
        default: false
      staging_url:
        description: "Approved isolated staging base URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  health-load:
    name: Bounded staging health workload
    if: inputs.approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NSOS_LOAD_TEST_APPROVED: "true"
      NSOS_STAGING_AUDIT_URL: ${{ inputs.staging_url }}
      NSOS_LOAD_TEST_REQUESTS: "50"
      NSOS_LOAD_TEST_CONCURRENCY: "10"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run bounded read-only workload
        run: node scripts/measure-health-load.mjs
