name: NSOS staging Tigris storage smoke test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TEST-STAGING-TIGRIS to authorize one disposable object test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nsos-staging-tigris-smoke-test
  cancel-in-progress: false

jobs:
  tigris-smoke-test:
    name: Upload, download, compare, and delete one temporary object
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'TEST-STAGING-TIGRIS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Validate staging-only configuration
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in S3_BUCKET S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing staging environment secret: $name"
              exit 1
            fi
          done
          if [ "$S3_ENDPOINT" != "https://t3.storage.dev" ]; then
            echo "::error::Unexpected endpoint; refusing to run."
            exit 1
          fi
          if [ "$S3_BUCKET" != "nsos-staging-assets-2026" ]; then
            echo "::error::Unexpected bucket; refusing to run."
            exit 1
          fi
          echo "Staging bucket and Tigris endpoint validated. Secret values are not printed."

      - name: Validate Tigris credential format without exposing secrets
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$S3_ACCESS_KEY_ID" in
            tid_*) ;;
            *) echo "::error::Access key does not have the documented Tigris access-key prefix."; exit 1 ;;
          esac
          case "$S3_SECRET_ACCESS_KEY" in
            tsec_*) ;;
            *) echo "::error::Secret key does not have the documented Tigris secret-key prefix."; exit 1 ;;
          esac
          if [[ "$S3_ACCESS_KEY_ID" =~ [[:space:]] || "$S3_SECRET_ACCESS_KEY" =~ [[:space:]] ]]; then
            echo "::error::A credential contains whitespace; secret values remain hidden."
            exit 1
          fi
          echo "PASS: credential prefixes and whitespace checks passed. Values were not printed."

      - name: Install AWS CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/awscli-venv"
          "$RUNNER_TEMP/awscli-venv/bin/pip" install --disable-pip-version-check awscli
          echo "$RUNNER_TEMP/awscli-venv/bin" >> "$GITHUB_PATH"

      - name: Test one disposable object and remove it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          key="nsos-smoke-tests/github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          uploaded=false

          # Tigris uses the global endpoint and region "auto". Use explicit
          # path-style addressing as a diagnostic contrast to the prior
          # virtual-hosted attempts.
          mkdir -p "$HOME/.aws"
          cat > "$HOME/.aws/config" <<'EOF'
          [default]
          region = auto
          signature_version = s3v4
          s3 =
            addressing_style = path
          EOF
          export AWS_CONFIG_FILE="$HOME/.aws/config"

          echo "AWS CLI version: $(aws --version 2>&1)"
          echo "Runner UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Effective AWS configuration (credentials are masked):"
          aws configure list

          cleanup() {
            if [ "$uploaded" = true ]; then
              aws --region auto --endpoint-url "$S3_ENDPOINT" s3api delete-object \
                --bucket "$S3_BUCKET" --key "$key" >/dev/null || {
                  echo "::error::Temporary object cleanup failed. Object key: $key"
                  return 1
                }
              uploaded=false
              echo "PASS: temporary object deleted from the staging bucket."
            fi
          }
          on_exit() {
            cleanup || true
            rm -rf "$workdir"
          }
          trap on_exit EXIT

          printf 'NSOS Tigris staging smoke test\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$workdir/source.txt"

          aws --region auto --endpoint-url "$S3_ENDPOINT" s3api put-object \
            --bucket "$S3_BUCKET" --key "$key" --body "$workdir/source.txt" \
            --content-type text/plain >/dev/null
          uploaded=true

          aws --region auto --endpoint-url "$S3_ENDPOINT" s3api get-object \
            --bucket "$S3_BUCKET" --key "$key" "$workdir/download.txt" >/dev/null

          if ! cmp --silent "$workdir/source.txt" "$workdir/download.txt"; then
            echo "::error::Downloaded object does not match uploaded contents."
            exit 1
          fi
          echo "PASS: temporary object uploaded and downloaded with identical contents."

          cleanup
          trap - EXIT
          rm -rf "$workdir"


  tigris-sdk-diagnostic:
    name: Independent AWS SDK v3 signing diagnostic
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'TEST-STAGING-TIGRIS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Validate staging target
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$S3_BUCKET" = "nsos-staging-assets-2026" ] || { echo "::error::Unexpected bucket; refusing to run."; exit 1; }
          [ "$S3_ENDPOINT" = "https://t3.storage.dev" ] || { echo "::error::Unexpected endpoint; refusing to run."; exit 1; }
          echo "Validated exact staging bucket and endpoint."

      - name: Test Tigris using independent AWS SDK v3 signer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          sdkdir="$RUNNER_TEMP/tigris-sdk"
          mkdir -p "$sdkdir"
          npm install --prefix "$sdkdir" --no-audit --no-fund @aws-sdk/client-s3
          cat > "$sdkdir/test.mjs" <<'EOF'
          import {
            S3Client, HeadBucketCommand, PutObjectCommand,
            GetObjectCommand, DeleteObjectCommand
          } from "@aws-sdk/client-s3";
          import { randomUUID } from "node:crypto";

          const client = new S3Client({
            region: "auto",
            endpoint: process.env.S3_ENDPOINT,
            forcePathStyle: false,
            credentials: {
              accessKeyId: process.env.AWS_ACCESS_KEY_ID,
              secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY
            }
          });
          const bucket = process.env.S3_BUCKET;
          const key = `nsos-smoke-tests/sdk-${process.env.GITHUB_RUN_ID}-${randomUUID()}.txt`;
          let uploaded = false;

          function reportError(stage, error) {
            // Log only provider error fields and request identifiers. Never log
            // credentials, request headers, authorization data, or signed requests.
            const safeText = (value) => typeof value === "string"
              ? value.replace(/[\\u0000-\\u001f\\u007f]/g, " ").slice(0, 500)
              : null;
            console.error(JSON.stringify({
              stage,
              errorName: safeText(error?.name) ?? "UnknownError",
              errorCode: safeText(error?.Code ?? error?.code),
              errorMessage: safeText(error?.message),
              httpStatusCode: error?.$metadata?.httpStatusCode ?? null,
              requestId: safeText(error?.$metadata?.requestId),
              extendedRequestId: safeText(error?.$metadata?.extendedRequestId)
            }));
          }

          try {
            await client.send(new HeadBucketCommand({ Bucket: bucket }));
            console.log("PASS: SDK HeadBucket authenticated successfully.");

            const body = `NSOS Tigris SDK diagnostic ${process.env.GITHUB_RUN_ID}\n`;
            await client.send(new PutObjectCommand({
              Bucket: bucket, Key: key, Body: body, ContentType: "text/plain"
            }));
            uploaded = true;
            const result = await client.send(new GetObjectCommand({ Bucket: bucket, Key: key }));
            const downloaded = await result.Body.transformToString();
            if (downloaded !== body) throw new Error("Downloaded object content mismatch");
            console.log("PASS: SDK disposable object round-trip matched exactly.");
          } catch (error) {
            reportError("SDK S3 operation", error);
            process.exitCode = 1;
          } finally {
            if (uploaded) {
              try {
                await client.send(new DeleteObjectCommand({ Bucket: bucket, Key: key }));
                console.log("PASS: SDK disposable object deleted.");
              } catch (error) {
                reportError("SDK cleanup", error);
                process.exitCode = 1;
              }
            } else {
              console.log("No disposable object was confirmed uploaded; no delete attempted.");
            }
            client.destroy();
          }
          EOF
          node "$sdkdir/test.mjs"
