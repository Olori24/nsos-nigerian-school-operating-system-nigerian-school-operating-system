name: NSOS Production Deploy

on:
  # Production deployment is deliberately manual. Successful CI must never
  # publish to Production as a side effect of merging an unrelated PR.
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Explicitly approve deployment of the selected main commit"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: nsos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.confirm_production_deploy == 'yes'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
      DEPLOY_COMMIT: ${{ github.sha }}
    steps:
      - name: Require production deploy hook
        run: |
          if [ -z "$PRODUCTION_DEPLOY_HOOK_URL" ]; then
            echo "Missing required repository secret: PRODUCTION_DEPLOY_HOOK_URL"
            echo "Configure the production provider's authenticated deploy hook before enabling production deploys."
            exit 1
          fi

      - name: Trigger production deployment
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$PRODUCTION_DEPLOY_HOOK_URL" \
            --header "Content-Type: application/json" \
            --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"commit\":\"${DEPLOY_COMMIT}\",\"ref\":\"main\",\"source\":\"github-actions-manual\"}"

      - name: Record deployment trigger
        run: |
          echo "Production deployment triggered for ${GITHUB_REPOSITORY}@${DEPLOY_COMMIT}."
